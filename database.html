<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実データ検索・図鑑 | Last Asylum Strategy Wiki</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo">
        🛡️ LAST ASYLUM <span class="badge">WIKI</span>
      </a>

      <button class="menu-toggle" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">トップ</a>
        <a href="calculator.html" class="nav-link">資源計算機</a>
        <a href="database.html" class="nav-link active">データベース</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      
      <h1 class="section-title">実データ一覧・検索 (95件)</h1>

      <div class="calc-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="名称・カテゴリ・ギフトコード・タグで即時検索..." style="margin-bottom:1rem;">
        
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm tab-btn active" data-category="all">すべて</button>
          <button class="btn btn-secondary btn-sm tab-btn" data-category="facility">🏰 施設</button>
          <button class="btn btn-secondary btn-sm tab-btn" data-category="hero">🦁 ヒーロー</button>
          <button class="btn btn-secondary btn-sm tab-btn" data-category="gift_code">🎁 ギフトコード</button>
        </div>
        
        <div id="result-count" style="font-size:0.85rem; color:var(--text-muted); margin-top:0.75rem;">読み込み中...</div>
      </div>

      <div id="items-container" class="grid-cards"></div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Last Asylum Strategy Wiki Project. Non-official Fan Site based on real extracted data.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/database.js"></script>
</body>
</html>
